<script>
const LIMIT = 500;
const grid  = document.getElementById('grid');
const q     = document.getElementById('q');
const tabs  = document.getElementById('tabs');
const toast = document.getElementById('toast');
let current = null;

function flash(text) {
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(flash.timer);
  flash.timer = setTimeout(() => toast.classList.remove('show'), 1400);
}

function build() {
  const names = Object.keys(window.__ICONS__);
  if (!names.length) {
    grid.innerHTML = '<p class="empty">No icon data embedded. Run <code>python3 tools/build_manifest.py</code>.</p>';
    return;
  }
  names.forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.innerHTML = name + '<em>' + window.__ICONS__[name].files.length + '</em>';
    b.setAttribute('aria-selected', i === 0);
    b.onclick = () => {
      current = name;
      [...tabs.children].forEach(c => c.setAttribute('aria-selected', c === b));
      render();
    };
    tabs.appendChild(b);
    if (i === 0) current = name;
  });
  render();
}

function render() {
  const term = q.value.trim().toLowerCase();
  const { path, files } = window.__ICONS__[current];
  const hits = term ? files.filter(f => f.toLowerCase().includes(term)) : files;

  grid.innerHTML = '';
  if (!hits.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'No icons match "' + term + '" in ' + current + '.';
    grid.appendChild(p);
    return;
  }

  const frag = document.createDocumentFragment();
  for (const file of hits.slice(0, LIMIT)) {
    const cell = document.createElement('button');
    cell.className = 'cell';
    cell.type = 'button';
    const label = file.replace(/\.(svg|png)$/, '').replace(/@3x$/, '');
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = path + '/' + file;
    img.alt = '';
    const span = document.createElement('span');
    span.textContent = label;
    cell.append(img, span);
    cell.onclick = () => copy(path, file);
    frag.appendChild(cell);
  }
  grid.appendChild(frag);

  if (hits.length > LIMIT) {
    const p = document.createElement('p');
    p.className = 'more';
    p.textContent = 'Showing ' + LIMIT + ' of ' + hits.length + ' — refine your search to see the rest.';
    grid.appendChild(p);
  }
}

const CDN = 'https://cdn.jsdelivr.net/gh/hongyinull/instagram-threads-icons@main';

async function copy(path, file) {
  const mode = document.getElementById('fmt').value;
  const cdnUrl = CDN + '/' + path + '/' + file;
  let text, label;

  if (mode === 'cdn')       { text = cdnUrl;                                  label = 'CDN URL copied'; }
  else if (mode === 'path') { text = path + '/' + file;                       label = 'Repo path copied'; }
  else if (mode === 'img')  { text = '<img src="' + cdnUrl + '" width="24" alt="">'; label = '<img> tag copied'; }
  else if (mode === 'use') {
    if (!file.endsWith('.svg')) { flash('Sprites are SVG only'); return; }
    const parts = path.split('/');
    const id = file.replace(/\.svg$/, '');
    text = '<svg width="24" height="24"><use href="' + CDN + '/sprites/' +
           parts[1] + '-' + parts[2] + '.svg#' + id + '"/></svg>';
    label = 'Sprite reference copied';
  } else {
    if (!file.endsWith('.svg')) { flash('SVG markup is SVG only'); return; }
    try {
      const res = await fetch(path + '/' + file);
      text = (await res.text()).trim();
      label = 'SVG markup copied';
    } catch {
      text = cdnUrl;
      label = 'Offline — CDN URL copied instead';
    }
  }
  navigator.clipboard.writeText(text).then(() => flash(label), () => flash('Copy failed'));
}

q.addEventListener('input', render);
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape') { q.value = ''; render(); q.blur(); }
});
build();
</script>
</body>
